poll_interval: 1
zones:
  - name: Primary
    sensors:
      - path: /sys/class/hwmon/hwmon7
        index: 1
        offset: 0
    fans:
      - path: /sys/class/hwmon/hwmon5
        index: 1
        hysteresis: 10
        curve:
          temperatures:
            - 25
            - 30
            - 37
            - 40
          speeds:
            - 55
            - 80
            - 220
            - 255
      - path: /sys/class/hwmon/hwmon5
        index: 2
        hysteresis: 10
        curve:
          temperatures:
            - 25
            - 30
            - 37
            - 40
          speeds:
            - 55
            - 80
            - 220
            - 255
